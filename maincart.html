<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f9;
    }

    h1, h2, h3, h4 {
      margin: 0;
      padding: 0;
    }

    .body {
      display: flex;
      gap: 20px;
      padding: 20px;
      background: #ffffff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .container {
      flex: 2;
    }

    .heading {
      margin-bottom: 10px;
      font-size: 1.5em;
      color: #333;
    }

    .result {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 4px;
      background-color: #fafafa;
      min-height: 200px;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 4px;
    }

    .product-btn {
      padding: 5px 10px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .product-btn:hover {
      background-color: #0056b3;
    }

    .cart {
      flex: 1;
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 4px;
      background-color: #fafafa;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .cart-items {
      min-height: 150px;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cart-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .buy-btn {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
      margin-top: 10px;
    }

    .buy-btn:hover {
      background-color: #0056b3;
    }

    hr {
      border: none;
      border-top: 1px solid #ddd;
    }

    .mid {
      display: flex;
      gap: 5px;
      align-items: center;
    }
  </style>
</head>
<body>
  <h1 class="">Shopping Cart</h1> 
  <div class="body">
    <div class="container">
      <h3 class="heading">Products</h3>
      <div class="result"></div>
    </div>
    <div class="cart">
      <div class="cart-header">
        <h3>CART</h3>
        <p class="noOfItems">0 items</p>
      </div>
      <hr noshade="true" size="1px" />
      <div class="cart-items"></div>
      <hr noshade="true" size="1px" />
      <div class="cart-footer cart-header">
        <h4>Total</h4>
        <p class="total">$0</p>
      </div>
      <button class="buy-btn">PROCEED TO BUY</button>
    </div>
  </div>
  <script>
    const products = [
      { name: "Adidas Shoes", price: 2500, id: 1, quantity: 1 },
      { name: "Sting Energy Drink", price: 120, id: 2, quantity: 1 },
      { name: "Umbrella", price: 500, id: 3, quantity: 1 },
      { name: "Cat Food", price: 900, id: 4, quantity: 1 },
      { name: "T Shirt", price: 300, id: 5, quantity: 1 },
      { name: "Book", price: 100, id: 6, quantity: 1 },
    ];

    let cart = [];

    const productsHTML = products.map(
      (product) => `<div class="product-card">
            <h2 class="product-name">${product.name}</h2>
            <strong>$${product.price}</strong>
            <button class="product-btn" id=${product.id}>Add to Cart</button>
        </div>`
    );
    const result = document.querySelector(".result");
    result.innerHTML = productsHTML.join("");

    function updateCart() {
      const cartHTML = cart.map(
        (item) => `<div class="cart-item">
                <h3>${item.name}</h3>
                <div class="cart-detail">
                  <div class="mid">
                      <button onclick="decrItem(${item.id})">-</button>
                      <p>${item.quantity}</p>
                      <button onclick="incrItem(${item.id})">+</button>
                  </div>
                  <p>$${item.price * item.quantity}</p>
                  <button onclick="deleteItem(${item.id})" class="cart-product" id=${item.id}>D</button>
                </div>
              </div>`
      );

      const cartItems = document.querySelector(".cart-items");
      cartItems.innerHTML = cartHTML.join("");
    }

    let num = document.querySelectorAll(".product-btn").length;
    for (let i = 0; i < num; i++) {
      document.querySelectorAll(".product-btn")[i].addEventListener("click", function (e) {
        addToCart(products, parseInt(e.target.id));
      });
    }

    function addToCart(products, id) {
      const product = products.find((product) => product.id === id);
      const cartProduct = cart.find((product) => product.id === id);
      if (cartProduct != undefined && product.id == cartProduct.id) {
        incrItem(id);
      } else {
        cart.unshift({ ...product }); // Clone the product to avoid shared reference
      }
      updateCart();
      getTotal(cart);
    }

    function getTotal(cart) {
      let { totalItem, cartTotal } = cart.reduce(
        (total, cartItem) => {
          total.cartTotal += cartItem.price * cartItem.quantity;
          total.totalItem += cartItem.quantity;
          return total;
        },
        { totalItem: 0, cartTotal: 0 }
      );
      const totalItemsHTML = document.querySelector(".noOfItems");
      totalItemsHTML.innerHTML = `${totalItem} items`;
      const totalAmountHTML = document.querySelector(".total");
      totalAmountHTML.innerHTML = `$${cartTotal}`;
    }

    function incrItem(id) {
      for (let i = 0; i < cart.length; i++) {
        if (cart[i] && cart[i].id == id) {
          cart[i].quantity += 1;
        }
      }
      updateCart();
      getTotal(cart);
    }

    function decrItem(id) {
      for (let i = 0; i < cart.length; i++) {
        if (cart[i].id == id && cart[i].quantity > 1) {
          cart[i].quantity -= 1;
        }
      }
      updateCart();
      getTotal(cart);
    }

    function deleteItem(id) {
      for (let i = 0; i < cart.length; i++) {
        if (cart[i].id === id) {
          cart[i].quantity = 1;
          cart.splice(i, 1);
        }
      }
      updateCart();
      getTotal(cart);
    }
  </script>
</body>
</html>
